name: Bug 报告
description: 报告可以稳定复现的问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除 Cookie、Token、签名链接、本机路径和个人信息。
  - type: input
    id: version
    attributes:
      label: 版本或提交号
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 运行方式
      options: [源码, Portable ZIP, 安装版]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用公开示例链接或描述链接类型，不要提交私人链接。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏错误
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除 Cookie、Token、API Key、绝对路径、签名参数和个人信息。
          required: true
