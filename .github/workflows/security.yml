name: Dependency security

on:
  push:
    branches: [main, opensource]
    paths:
      - 'requirements*.txt'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'requirements*.txt'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audit tool
        run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict
      - name: Audit build dependencies
        run: python -m pip_audit -r requirements-build.txt --strict
      - name: Check publishable source
        run: python scripts/public_release_check.py
