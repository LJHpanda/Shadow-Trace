<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>影迹 · 本地媒体工作台</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("yingji_alt_theme") === "light" ? "light" : "dark";
    } catch (_) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./convert.css">
  <link rel="stylesheet" href="./telegram-bot.css">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="titlebar-brand"><span class="mini-logo"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="17.5" rx="3.4" fill="none" stroke="#ffffff" stroke-width="1.7"/><rect x="6.2" y="4.75" width="2.6" height="1.7" rx="0.7" fill="#ffffff"/><rect x="10.7" y="4.75" width="2.6" height="1.7" rx="0.7" fill="#ffffff"/><rect x="15.2" y="4.75" width="2.6" height="1.7" rx="0.7" fill="#ffffff"/><path fill="#ffffff" d="M12 8 L15.1 12.2 H13 V14.4 H11 V12.2 H8.9 Z"/><path fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" d="M7 17.3 V18.6 Q12 20.2 17 18.6 V17.3"/></svg></span><b>影迹</b><em>社区版</em><span>本地运行</span></div>
      <!-- 窗口装饰控件已移除（浏览器中无效）。若后续打包为 EXE（Electron / Tauri / PyWebView），在此处按框架规范添加带 IPC / window API 调用的真实控件。 -->
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="17.5" rx="3.4" fill="none" stroke="#ffffff" stroke-width="1.7"/><rect x="6.2" y="4.75" width="2.6" height="1.7" rx="0.7" fill="#ffffff"/><rect x="10.7" y="4.75" width="2.6" height="1.7" rx="0.7" fill="#ffffff"/><rect x="15.2" y="4.75" width="2.6" height="1.7" rx="0.7" fill="#ffffff"/><path fill="#ffffff" d="M12 8 L15.1 12.2 H13 V14.4 H11 V12.2 H8.9 Z"/><path fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" d="M7 17.3 V18.6 Q12 20.2 17 18.6 V17.3"/></svg></span>
          <div><b>影迹</b><small>YINGJI</small></div>
        </div>

        <nav id="primaryNav" aria-label="主要导航">
          <button type="button" data-view="download" class="active"><span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M8.5 8.5 12 12l3.5-3.5"/><path d="M5 15v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></svg></span><b>下载</b></button>
          <button type="button" data-view="batch"><span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7l8 4 8-4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 17l8 4 8-4"/></svg></span><b>批量</b></button>
          <button type="button" data-view="tasks"><span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg></span><b>任务</b><em id="navTaskCount">0</em></button>
          <button type="button" data-view="convert"><span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 4 11l3 3"/><path d="M4 11h11"/><path d="M17 16l3-3-3-3"/><path d="M20 13H9"/></svg></span><b>格式转换</b></button>
          <button type="button" data-view="telegramBot"><span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 21.7a.5.5 0 0 0 .9 0l6.5-19a.5.5 0 0 0-.6-.6l-19 6.5a.5.5 0 0 0 0 .9l7.9 3.2a2 2 0 0 1 1.1 1.1z"/><path d="m21.9 2.1-10.9 10.9"/></svg></span><b>远程助手</b></button>
          <button type="button" data-view="data"><span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></svg></span><b>数据</b></button>
          <button type="button" data-view="settings"><span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="M4.9 4.9l2.1 2.1"/><path d="M17 17l2.1 2.1"/><path d="M19.1 4.9 17 7"/><path d="M7 17l-2.1 2.1"/></svg></span><b>设置</b></button>
        </nav>

        <div class="sidebar-foot">
          <div class="edition-card">
            <span>开源</span>
            <div><b>社区版</b><small>GPLv3 · 数据仅存本机</small></div>
          </div>
        </div>
      </aside>

      <main id="mainContent" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="assertive"></div>
  <div id="modalRoot"></div>
  <!-- 扩展模块：自注册到 window.YingjiExtViews，须在主脚本首次渲染前就位 -->
  <script src="./convert.js" defer></script>
  <script src="./telegram-bot.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
